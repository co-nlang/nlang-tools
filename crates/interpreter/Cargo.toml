[package]
name = "nlang-interpreter"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
tempfile = "3.3"

[dependencies]
nlang-parser = { path = "../parser" }
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "=2.5.0", features = ["serde"] }
hashbrown = "0.14"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
ring = "0.17"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
