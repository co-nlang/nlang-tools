[package]
name = "oo"
version = "0.2.36"
edition = "2021"

[lib]
name = "oo"
path = "src/lib.rs"

[[bin]]
name = "oo"
path = "src/main.rs"

[[bin]]
name = "nlint"
path = "src/bin/nlint.rs"

[dependencies]
nlang-parser = { path = "../parser" }
nlang-interpreter = { path = "../interpreter" }
clap = { version = "=4.4.18", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "=2.5.0"
rustyline = "11.0"
