[package]
name = "oo"
version = "0.42.0"
edition = "2021"

[lib]
name = "oo"
path = "src/lib.rs"

[[bin]]
name = "oo"
path = "src/main.rs"

[[bin]]
name = "nlint"
path = "src/bin/nlint.rs"

[dependencies]
nlang-parser = { path = "../parser" }
nlang-interpreter = { path = "../interpreter" }
clap = { version = "=4.4.18", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "=2.5.0"
rustyline = "11.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
# Probe-side only. The advertise_wire probes must be able to mint packets the
# engine would never mint — a valid signature under the wrong identity, a
# stale timestamp, a body altered after signing. An adversary that can only
# use the engine's own client cannot express those.
ring = "0.17"
hex = "0.4"
